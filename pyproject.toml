[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilllens"
version = "1.1.1"
description = "技能包体检器：给任何 .skill 打一个 0-100 分，并指出下一条该改什么"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "lishengdan", email = "3434153697@qq.com" }]
keywords = ["agent", "skill", "claude", "lint", "review", "kstar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
skilllens = "skilllens.cli:main"

[project.urls]
Homepage = "https://github.com/1sd-sd/skilllens"
Issues = "https://github.com/1sd-sd/skilllens/issues"

[tool.setuptools]
packages = ["skilllens"]
